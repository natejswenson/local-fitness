version: "1.0"
title: "Model-agnostic alt-model shadow-run (generalize the gemma4/Ollama path via opencode)"
date: "2026-07-08"
source: design
revision: 10  # after quality-gate 10 rounds + look-harder verification, PASS

api_surface:
  - module: agent/opencode_model.py
    functions:
      - "generate_opencode_completion(system_prompt: str, user_prompt: str, *, model: str, agent: str, timeout: float=300.0) -> str   # model='provider/model' e.g. 'opencode/deepseek-v4-flash-free'; raises RuntimeError on any failure (binary missing, non-zero exit, timeout, malformed/empty output, detected unsafe agent-fallback, or fail-closed pre-check failure)"
  - module: agent/briefing.py
    functions:
      - "_alt_model_name(model: str) -> str | None   # renamed from _local_model_name; strips '_ALT_MODEL_PREFIX' ('opencode:', was 'ollama:') and returns the full 'provider/model' string unchanged (was: bare Ollama model name)"
    types:
      - "_ModelProfile{temperature: float=0.4, ollama_format_schema: Callable[[],dict]|None=None, plan_prompt_facts: Callable[[dict],str]|None=None, plan_status_appendix: Callable[[str,dict|None],str]|None=None, reshape: Callable[[str],str]|None=None}   # frozen dataclass"
      - "_MODEL_PROFILES: dict[str, _ModelProfile]   # keyed by exact 'provider/model' string, e.g. 'ollama/gemma4'; additive-only for future models"
      - "_DEFAULT_PROFILE: _ModelProfile   # zero-tuning fallback for any model with no registry entry"
  - module: agent/local_model.py
    functions:
      - "generate_local_completion(...)   # UNCHANGED signature/behavior; still called for provider=='ollama', now receiving a bare (unprefixed) model name"
  - env_vars:
      - "LOCAL_FITNESS_OPENCODE_AGENT (default 'fitness-brief')   # names the tool-free opencode agent used for the opencode-CLI transport"

invariants:
  checkable:
    - "_assert_fixture_only_data() is called before either transport, unconditionally, for every non-Claude model, and checks THREE paths — db.DEFAULT_DB_PATH, briefs.DEFAULT_BRIEFINGS_DIR, and notes._default_notes_path() (extended from two) — all compared against one shared pre-resolved tmp_root = Path(tempfile.gettempdir()).resolve(), never a raw unresolved tempfile.gettempdir() call in a fresh expression (macOS /var vs /private/var symlink mismatch would otherwise break every legitimate tmp path)."
    - "No hardcoded model-name string equality remains in briefing.py's dispatch or transport-selection logic — only the profile-registry lookup (_MODEL_PROFILES.get(alt_model_name, _DEFAULT_PROFILE)) and the provider == 'ollama' capability check."
    - "agent/opencode_model.py never imports or calls anything from local_model.py and vice versa — the two transports are independent and swappable per-provider."
    - "generate_and_save's production 06:30 path never reaches the alt-model branch — DEFAULT_MODEL is Claude, so _alt_model_name() returns None for it; only shadow-run's three script entry points (each passing an 'opencode:...'-prefixed model string) reach the branch."
    - "Every subprocess.run call in agent/opencode_model.py (the opencode agent list pre-check AND the opencode run invocation) uses argv-list form, never shell=True — command-injection guardrail, since the prompt text can carry free-form user-note content."
    - "opencode run argv ordering is exactly ['opencode','run','-m',model,'--format','json','--agent',agent,'--',message] — all flags ('-m','--format','--agent') appear BEFORE the literal '--' element, which is immediately followed only by message as the last element. Reversing this silently defeats both NDJSON parsing (--format json becomes a no-op) and the fail-closed agent guarantee (--agent becomes a no-op, falling back to the tool-enabled 'build' agent) with no visible error."
    - "The off-machine warning log in generate_opencode_completion fires unconditionally at the 'opencode run' call site only (after the fail-closed pre-check has already passed) — never at function entry, never before the pre-check; placing it earlier would emit a log even on the pre-check-failure path, which the design requires to stay log-free."
    - "'provider == \"ollama\"' in this design means exactly 'local Ollama daemon on local_model.DEFAULT_HOST (localhost:11434), reached directly, bypassing opencode' — never 'whatever a user's own opencode config's ollama provider is set to.' This is a stated, accepted v1 scope limitation, not a solved problem; no host-override mechanism is built."
    - "The RuntimeError message text for agent-fallback/pre-check failures is short and single-line, with the actionable pointer (e.g. 'see .env.example') placed FIRST — because shadow_run.py/capture_baseline.py truncate retained error text to first-line/200-chars, so a message that buries the pointer after other detail risks having it clipped before a user ever sees it."
    - "scripts/shadow_run.py and scripts/capture_baseline.py each add a load_dotenv(Path(__file__).resolve().parents[1] / '.env') call (parents[1], not cli.py's parents[2] — these scripts sit one level shallower than src/local_fitness/cli.py) so LOCAL_FITNESS_OPENCODE_AGENT actually takes effect on these entry points instead of silently falling back to the hardcoded default."

  testable:
    - "A 'opencode:ollama/gemma4' model string dispatches to local_model.generate_local_completion with model='gemma4' (bare, unprefixed) and the gemma4 profile's tightened schema/temperature 0.8."
    - "A 'opencode:opencode/deepseek-v4-flash-free' (or any non-ollama provider) model string dispatches to opencode_model.generate_opencode_completion and never touches local_model.py."
    - "Setting LOCAL_FITNESS_OPENCODE_AGENT to a distinct non-default value (via monkeypatch.setenv) and dispatching a non-ollama model string results in that exact value — not the hardcoded 'fitness-brief' default — being passed as the agent= argument to a mocked generate_opencode_completion."
    - "A model string with no matching _MODEL_PROFILES entry uses _DEFAULT_PROFILE (plain Brief.model_json_schema(), temperature 0.4, no plan-facts injection, no reshape) — new models get the safe generic path automatically."
    - "generate_opencode_completion raises RuntimeError for: non-zero exit, FileNotFoundError, TimeoutExpired, empty JSON-event stream, malformed JSON line, the fail-closed pre-check subprocess call itself failing (distinct 'opencode failed to respond' error), the pre-check succeeding but not finding the configured agent (the 'agent not found, see .env.example' error), and the detected 'falling back to default agent' stderr substring — each its own test case."
    - "Argv-ordering invariant test: inspects the CONSTRUCTED argv list passed to the mocked subprocess.run for the opencode run call and asserts, structurally, that -m/model, --format/json, and --agent/agent all appear at indices BEFORE the index of the literal '--' element, and '--' is immediately followed by message as the final element — an output-content-only test cannot distinguish 'flag silently ignored' from 'flag correctly parsed,' so this structural check is required."
    - "scripts/shadow_run.py's alt-model detection imports and uses the shared _ALT_MODEL_PREFIX constant instead of re-declaring the '\"ollama:\"'/'\"opencode:\"' literal string."
    - "scripts/shadow_run.py's dry-run messaging prints the ollama local/free message for provider == 'ollama' and a network/cost-varies message for any other provider — not one hardcoded 'local via Ollama' string for every alt-model-prefixed model."
    - "_assert_fixture_only_data()'s existing three tests (passes under tmp path, raises for real DB path, raises for real briefings dir) are unchanged and still pass; a new fourth test proves it also raises when notes._default_notes_path() resolves outside the temp dir."
    - "A caplog-based test proves the off-machine warning log line fires when provider != 'ollama' (in tests/test_opencode_model.py) and a separate caplog-based test in tests/test_briefing.py proves it does NOT fire for a provider == 'ollama' dispatch (asserting absence inside test_opencode_model.py would be vacuous, since generate_opencode_completion is structurally unreachable for ollama-provider models)."

integration_points:
  - "generate_streaming's alt-model branch: _alt_model_name(model) -> partition into (provider, bare_model) -> profile = _MODEL_PROFILES.get(alt_model_name, _DEFAULT_PROFILE) -> build alt_system_prompt/alt_prompt_text via prompts.brief_v2_system_prompt/user_prompt (+ profile.plan_prompt_facts if present) -> _assert_fixture_only_data() (now 3-path) -> if provider=='ollama': local_model.generate_local_completion(..., format=profile.ollama_format_schema() or Brief.model_json_schema(), temperature=profile.temperature); else: opencode_model.generate_opencode_completion(..., model=alt_model_name, agent=os.environ.get('LOCAL_FITNESS_OPENCODE_AGENT','fitness-brief')) -> profile.reshape(raw) if present -> profile.plan_status_appendix(raw, plan_today) if present -> _finalize_brief (unchanged tail)."
  - "Entry-point coverage: scripts/shadow_run.py, scripts/capture_baseline.py, and scripts/ab_brief.py all call briefing._generate, which drains generate_streaming; generate_and_save (production 06:30 job) drains generate_streaming directly via its own inner _run(), always with a Claude model, so it never executes the alt-model branch. Only shadow_run.py and capture_baseline.py have fixture-isolation harnesses (_capture_v2/_capture_live); ab_brief.py has none and is explicitly out of scope for alt-model end-to-end testing."
  - "scripts/shadow_run.py's _capture_v2 must print at least the first line of a caught alt-model RuntimeError alongside its existing per-scenario status line (not just increment a flake count) — today the message propagates with NO log emitted anywhere in the failure path (the alt-model branch returns before generate_streaming's only LOG.exception call, which lives inside a try/except the branch never enters), so this print is the sole surface the actionable .env.example remediation pointer ever reaches. capture_baseline.py's console output has the same gap and is an accepted, undispatched follow-up (message still survives truncated in the written baseline JSON)."
  - "Dead-code removal (same commit): prompts.py's brief_v2_system_prompt_gemma4/brief_v2_user_prompt_gemma4, their module-level constants _GEMMA4_SYSTEM_APPENDIX/_GEMMA4_USER_APPENDIX (prompts.py:772,790) and the explanatory comment block preceding them (prompts.py:750-769), plus their 3 tests and section-header comment in test_prompts.py."
  - "Rename sweep (illustrative, not exhaustive — grep -rn '\"ollama:\"' across the whole repo is the real obligation): _LOCAL_MODEL_PREFIX/_local_model_name -> _ALT_MODEL_PREFIX/_alt_model_name; local_model_name/local_system_prompt/local_prompt_text/local_format sketch variables -> alt_*; local_model.py's module docstring; briefing.py's ValueError message; scripts/shadow_run.py's is_local_model -> is_alt_model; ~12 literal occurrences across tests/test_briefing.py. local_model.py's FILENAME is explicitly NOT renamed (genuinely Ollama-specific/local). local_temperature is eliminated (folded into profile.temperature), not renamed."
  - ".env.example gains LOCAL_FITNESS_OPENCODE_AGENT plus the exact ~/.config/opencode/opencode.jsonc tool-free-agent snippet (complete literal JSON, not a 'mirror the existing fitness agent' pointer)."

ambiguity_resolutions:
  - "Transport mechanism: route through the opencode CLI (subprocess, NDJSON parsing) rather than a generalized OpenAI-compatible HTTP client — user-confirmed; this is the only way to reach opencode's own hosted gateway models."
  - "Dispatch architecture: capability-aware dual transport (provider=='ollama' keeps direct-HTTP grammar-constrained decoding unchanged; every other provider routes through the new opencode-CLI transport) — user-confirmed, driven by measured numbers (gemma4 base/stricter prompt ~5/12 valid vs. Ollama structured-output 12/12, 0 flakes; no opencode-CLI passthrough exists for grammar-constrained decoding as of opencode 1.17.15 per a live unresolved upstream issue)."
  - "'provider == \"ollama\"' scope limitation — quality-gate round 7: rather than building a host-override mechanism to fully generalize the Ollama path, the design documents plainly that 'ollama' always means the local daemon on localhost:11434 bypassing opencode entirely, regardless of a user's own opencode-configured ollama endpoint. Accepted v1 scope limitation, lean-v1/harden-reactively philosophy; DEFAULT_HOST flagged as a future extension point only."
  - "AC#3 ('fails loudly') corrected twice during quality-gate (rounds 7-8): the promise is not delivered by the real entry points as originally stated — no LOG.exception safety net exists for the alt-model failure path at all (round 8 found the original 'already logged via LOG.exception' framing was itself factually false). The remediation is scoped to a minimal _capture_v2 print-fix rather than a shadow-run reporting-pipeline rewrite; capture_baseline.py's matching gap is an explicitly accepted, undispatched follow-up."
  - "Fixture-only safety gate extended to a third path (notes._default_notes_path()) — quality-gate round 3 found the original 'no code change needed, already transport-agnostic' claim was wrong: the gate never checked the user-notes path that brief_v2_system_prompt injects, so ab_brief.py's un-isolated invocation could ship real personal notes to a third-party model while the gate reported safe. This is additive coverage of a real hole, not a mechanism change."
  - "Subprocess argv ordering (flags before '--', message last) — quality-gate rounds 5-6: an intermediate fix attempt got this backwards (flags placed after '--'), which round 6's fresh review caught as Fatal since it would silently defeat both NDJSON parsing and the fail-closed agent-safety guarantee with no visible error. Corrected and given a dedicated structural-argv test requirement so output-content-only tests can't mask a future regression of the same kind."
  - "Naming rename ('local' -> 'alt') scoped precisely: local_model.py's FILENAME stays as-is (genuinely local/Ollama-specific), only the generic dispatch identifiers (_LOCAL_MODEL_PREFIX, _local_model_name, sketch variables) drop 'local' — because 'local' is actively misleading once opencode-routed (off-machine) models are in scope."
