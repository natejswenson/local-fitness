ambiguity_resolutions:
  - >-
    trend_direction flat band: defined from the sample SD of the fetched
    window series (not the 60-day baseline SD — only rhr/sleep_seconds have
    one). The slope is per-OBSERVATION, not per-day: get_metric_trend
    regresses against the non-null sample index (xs = range(n),
    tools.py:249-255), so the fitted total change across the window is
    slope * (n - 1), NOT slope * window_days — flat when
    abs(slope_per_day * (n - 1)) <= 0.5 * sample_sd, i.e. the tool passes
    flat_threshold = (0.5 * sample_sd) / max(n - 1, 1) so the in-function
    comparison abs(slope_per_day) <= flat_threshold equals that band
    (dividing by window_days is the wrong units — ~10x too strict for
    sparse metrics like vo2_max with n=4 over days=30). INCLUSIVE <=, so
    the constant-series case (sample_sd 0, slope 0) is 'flat' with no
    side-door. trend_direction returns 'no data' iff slope_per_day is
    None; get_metric_trend owns the n < 2 -> slope_per_day=None mapping
    (the tool otherwise computes slope 0.0 even for n=1 via its 'or 1e-9'
    denominator, tools.py:254 — and the payload's slope_per_day key
    becomes null on that path, a deliberate payload change) and skips the
    threshold computation entirely for n < 2 (sample SD undefined at
    n = 1; the max(..., 1) is belt-and-suspenders — that branch never
    reaches the expression). The 0.5 is a named constant in interpret.py;
    the <= inclusivity is pinned (value exactly at threshold -> flat)
  - >-
    ctl_direction does NOT route through trend_direction (a scalar % delta
    has no slope/series/SD): it uses the new delta_direction(pct_change, *,
    flat_pct=2.0) classifier — None -> 'no data', abs <= flat_pct -> 'flat'
    (inclusive), sign otherwise; 2.0 a named constant, boundary pinned both
    sides
