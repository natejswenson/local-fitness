version: "1.0"
ticket: "N/A"
epic: "N/A"
title: "Deterministic intelligence, MCP payload quality, agent UX, layer-separation hardening"
date: "2026-07-12"

api_surface:
  - name: "interpret module"
    type: "module"
    signature: "src/local_fitness/agent/interpret.py"
    description: >-
      New pure module, stdlib-only imports (no db, no SDK, no schemas).
      Houses the shared classifiers: tsb_zone(tsb) -> str;
      pct_change(now, then) -> float | None (returns UNROUNDED; rounding
      stays at the boundaries — brief_planner keeps its round(..., 1) on
      the signal, brief_planner.py:508, and training_load_status rounds
      at the payload boundary per the 1dp pct budget);
      trend_direction(slope_per_day: float | None, *, flat_threshold) -> str
      ('no data' iff slope_per_day is None; 'flat' via INCLUSIVE
      abs(slope_per_day) <= flat_threshold, so a zero threshold from a
      constant series still classifies slope 0 as flat; the caller —
      get_metric_trend — supplies flat_threshold =
      (0.5 * sample_sd) / max(n - 1, 1) per the flat-band ambiguity
      resolution (slope is per-observation), and owns the n < 2 ->
      slope_per_day=None mapping, since the tool otherwise computes slope
      0.0 even for n=1 via its 'or 1e-9' denominator, tools.py:254);
      delta_direction(pct_change: float | None, *, flat_pct: float = 2.0)
      -> str (scalar %-delta classifier for fields with no series/slope:
      None -> 'no data'; abs(pct_change) <= flat_pct -> 'flat', inclusive;
      sign otherwise; 2.0 a named constant, boundary pinned both sides);
      baseline_position(sd_distance) -> str;
      correlation_read(r) -> dict | None (legend thresholds mirrored from
      tools.py:679, lower-bound INCLUSIVE: |r| >= 0.2 modest, >= 0.4
      moderate, >= 0.6 strong, below 0.2 weak; direction at r == 0.0 ->
      'positive' via >=, consistent with sd_position; r None -> None,
      i.e. no strength/direction);
      effect_size(mean_a, mean_b, sd_a, sd_b, n_a, n_b) -> dict | None —
      degrades PER-FIELD, never whole-None unless ALL inputs are None:
      delta_pct needs only the two means (None only when mean_b is 0/None
      or mean_a is None, else computed even when SDs/ns can't support a
      d); cohens_d/magnitude are None when either SD is 0/None or either
      n < 2; magnitude bands lower-bound inclusive (|d| >= 0.2 small,
      >= 0.5 moderate, >= 0.8 large, below 0.2 negligible);
      sd_position(value, mean, sd) -> dict | None (direction at delta 0 is
      'above' via >= — effectively unreachable in sane calls, though a
      negative sd_threshold, sign unvalidated at tools.py:543, could reach
      it via find_anomalies; defined and pinned regardless).
      All handle None/zero/degenerate input without raising.
  - name: "tools.weekly_rollup"
    type: "function"
    signature: "weekly_rollup(workouts: list[dict], target_date: date) -> dict  # module-level in agent/tools.py"
    returns: "{week_planned_mi, week_actual_mi, slips, days: list[dict]}"
    description: >-
      Pure, I/O-free (no connections) extraction of _build_plan_section's
      trailing-week aggregation. Each days entry is the canonical per-day
      shape {date, verdict, type, planned_mi, actual_mi}: the function owns
      the windowing, per-day to_miles conversion, and verdict-conditional
      actual_mi suppression, and the totals sum from that same list — so
      per-day rows and totals agree by construction (single copy of
      window/convert/suppress; tests/test_tools.py:1701 per-day pin survives
      via the shared suppression). days is REVERSE-CHRONOLOGICAL (most
      recent first) — pinned by tests/test_tools.py:1697-1698 and
      load-bearing downstream: plan_coach.build_prompt says 'most recent
      first' (plan_coach.py:77) and fallback_coaching_line picks the first
      non-pending entry as the latest graded day, so a forward order would
      silently change its verdict phrase. Empty window -> days: [] with
      zero totals; the empty->None short-circuit stays in
      _build_plan_section (consumer behavior — tests/test_tools.py:1713-1717
      pin unchanged). _build_plan_section consumes days AS-IS as the PDF
      table — current per-day entries carry exactly {date, type,
      planned_mi, actual_mi, verdict} (tools.py:1792-1798), no pace
      strings, so days IS the table with no per-day enrichment; only the
      today payload's to_miles/pace-string formatting (tools.py:1813-1818)
      stays local to the PDF. get_training_plan_progress's this_week
      carries the three totals only (its windowed workouts list already
      covers per-day data).
      Window: (trailing 7 days ending on target_date —
      deliberately different from plans.weekly_mileage's per-week_index
      rollup; matches the PDF's existing definition). Lives in
      agent/tools.py, NOT plans.py: it needs units.to_miles, and plans.py
      imports only config/db (plans.py:18) with a km-internal convention —
      a core->agent.units import is unsanctioned; both consumers
      (_build_plan_section and get_training_plan_progress) already live in
      tools.py, which imports units; tests import it directly from tools.
      Rounding order is part of the contract: per-day units.to_miles
      (2 dp), then sum, then round the total to 1 dp — the PDF's existing
      order (per-day conversion and summing at tools.py:1786-1804; totals'
      1dp rounding at tools.py:1837-1838); summing raw meters first can
      differ by 0.1. Documented aggregation semantics: the
      function itself excludes actual distance for verdict in
      ("pending", "compliant") — the existing PDF rule promoted to the
      shared definition of "week actual mileage", so PDF and MCP agree by
      construction (tests/test_tools.py:1687 pin, week_actual_mi == 6.9,
      holds by construction). No
      week_adherence_pct field (earlier-draft invention; whole-plan
      adherence_pct already exists on both plan tools). Called by
      _build_plan_section (PDF) and get_training_plan_progress ONLY —
      get_training_plan_status stays slim by design (perf pins + slim
      contract; see the plan-tool payload entry).
  - name: "plans.goal_gap"
    type: "function"
    signature: "goal_gap(predicted_finish_s: float | None, target_time_s: int | None) -> dict | None"
    returns: "{gap_seconds, gap_pct, on_pace: bool} | None"
    description: >-
      Pure seconds arithmetic — no units import needed, so plans.py is the
      right home (unlike weekly_rollup). predicted_finish_s is float |
      None: riegel_predict returns float (plans.py:341). None when either
      input is None. Positive gap = slower than goal.
      Attached to get_training_plan_progress ONLY — build_plan_status
      (plans.py:869-903) computes no Riegel projection, so
      get_training_plan_status has no data source for it.
  - name: "units.format_duration (reused for durations — no format_hms sibling)"
    type: "function"
    signature: "format_duration(seconds: float | int | None) -> str | None"
    returns: "H:MM:SS at/over an hour, M:SS under; None -> None"
    description: >-
      No format_hms sibling is added: the existing format_duration
      (units.py:55-68) already emits the H:MM:SS shape. Sub-hour behavior
      verified for these fields: a 45:00 target renders as "45:00". Scope:
      workout/target durations (2d) ONLY — sleep does NOT use it (see
      units.format_hm).
  - name: "units.format_hm"
    type: "function"
    signature: "format_hm(seconds: float | int | None) -> str | None"
    returns: "hours-and-minutes, e.g. 27180 -> '7h 33m'; None -> None"
    description: >-
      NEW. The sleep-rendering convention — format_duration's "7:33:00"
      reads as a run duration; the repo deliberately renders sleep as
      "7h 33m" (brief_planner._hm in _SNAPSHOT_UNITS, brief_planner.py:596,
      per :437-439; prompts.py:64-65 mandates hours-and-minutes).
      Reproduces _hm's current output EXACTLY (brief_planner.py:437-443):
      f"{h}h {m:02d}m" at/over an hour — minutes zero-padded, "7h 05m"
      not "7h 5m" — and "{m}m" sub-hour ("45m"); None in -> None out.
      brief_planner._hm delegates to it (single source; _hm keeps its
      ""-on-None contract at its own boundary), and it formats
      _render_status's sleep row and
      status._metric_rows' value_formatted/baseline_formatted on
      sleep_seconds — so brief pool and snapshot rows render sleep
      identically by construction.
  - name: "plan_coach.build_prompt"
    type: "function"
    signature: "build_prompt(..., notes_text: str | None = None) -> tuple[str, str]"
    description: >-
      Signature extension, still pure/I-O-free. Appends notes section when
      notes_text provided; always includes metric-translation block.
  - name: "plan_coach.generate_coaching_line"
    type: "function"
    signature: "generate_coaching_line(..., notes_text: str | None = None) -> str"
    description: >-
      Signature extension: new notes_text param plumbed through to
      build_prompt. Enumerated test casualty: the monkeypatched fake in
      tests/test_tools.py:1729-1747 pins the current positional signature
      (TypeError -> silent fallback -> assertion failure); update it in the
      same change.
  - name: "plan_coach.ground_coaching_line"
    type: "function"
    signature: "ground_coaching_line(text: str, plan_section: dict) -> list[GroundingFlag]"
    description: >-
      Pure, advisory-only grounding of the PDF coaching line against the
      deterministic plan section. Never raises on arbitrary text. Logged by
      generate_brief_report; never gates the PDF. GroundingFlag requires an
      int takeaway_index (grounding.py:60): coaching-line flags use index 0
      (single coaching line, no takeaway list). Advisory-signal caveats:
      the pool includes string-shaped pace values ("9:23") tokenized
      numerically (9, 23) the way _display_numbers does, and days_to_race
      cited in prose is typically skipped by grounding's time-window rule
      — partial coverage, same character as V2's signal.
  - name: "training_load_status payload"
    type: "tool_payload"
    signature: >-
      + tsb_zone, ctl_pct_change_14d, ctl_direction (via
      delta_direction(ctl_pct_change_14d) — a scalar % delta, NOT routed
      through trend_direction); floats rounded
  - name: "correlate payload"
    type: "tool_payload"
    signature: "+ strength, direction; static legend string REMOVED; pearson_r 3dp"
  - name: "find_anomalies payload"
    type: "tool_payload"
    signature: "per-row + sd_distance, direction"
  - name: "compare_periods payload"
    type: "tool_payload"
    signature: >-
      + delta_pct, cohens_d, magnitude; effect_size degrades PER-FIELD —
      delta_pct computed from the means alone (None only when mean_b is
      0/None or mean_a is None), cohens_d/magnitude None when either SD is
      0/None or either n < 2 (a single-sample period yields sd 0 via the
      max(len-1, 1) denominator, tools.py:509), so two 1-day periods still
      carry delta_pct with cohens_d/magnitude None; floats rounded; (2g,
      designated cut) accepts distance_meters (activities, SUM semantics):
      per-period {n, total} (no mean/sd) + per-period total_mi convenience
      (miles-gated); top-level delta + delta_pct; NO cohens_d/magnitude
      for SUM metrics (no per-observation SD to pool)
  - name: "get_metric_trend payload"
    type: "tool_payload"
    signature: >-
      + slope_direction, vs_baseline; floats rounded; for n < 2 the
      payload's slope_per_day becomes null (not today's guarded 0.0)
      alongside slope_direction 'no data' — a deliberate, enumerated
      payload change
  - name: "get_training_plan_progress payload"
    type: "tool_payload"
    signature: >-
      + this_week, goal_gap, predicted_finish_formatted,
      target_time_formatted, per-workout target_duration_formatted and Fix C
      mile/pace fields; workouts list WINDOWED by default
      ([anchor_back - 14d, anchor_fwd + 7d] where anchor_back = frontier if
      not None else today, anchor_fwd = max(frontier or today, today) —
      today always in-window, defined on a fresh DB); new arg
      full: bool = false restores complete list; full-plan rollups
      unaffected by window
  - name: "get_training_plan_status payload"
    type: "tool_payload"
    signature: >-
      + target_time_formatted (target_time_seconds already in
      build_plan_status's payload — pure formatting);
      target_duration_formatted + Fix C fields on today/last_graded. NO
      this_week / goal_gap / predicted_finish_formatted — goal gap and
      projection genuinely lack a data source there (no Riegel query on
      the status path); this_week is excluded by the slim-by-design
      contract + pinned one-connection/latency budget, NOT data absence
      (the tool already loads activities_by_date for the plan window,
      tools.py:1485); description points at get_training_plan_progress for
      week rollups and goal gap
  - name: "get_workout_detail / recovery_pattern payloads"
    type: "tool_payload"
    signature: >-
      splits / matched workouts pass through _augment_workout (miles
      convention); recovery_pattern's SELECT (tools.py:721-724) widened to
      add avg_pace_sec_per_km + duration_seconds so the helper yields its
      full field set
  - name: "prompt surfaces"
    type: "prompt"
    signature: >-
      system_prompt + Charts bullet (render chart output in reply; note
      tests/test_prompts.py:34-37's V2-shorter-than-V1 pin survives —
      bullet lengthens V1's side only; mirroring it into
      brief_v2_system_prompt later would trip it);
      descriptions rewritten: chart, daily_snapshot, get_today_status,
      get_brief_context, get_training_plan_progress,
      get_training_plan_status (points at progress for week rollups / goal
      gap); error strings lose all CLI wording, remedies split per 3d:
      training_load_status's empty-DB error points at sync_garmin_data (a
      pull genuinely fixes it — the same days_pulled > 0 gate applies but
      benignly: a first pull on an empty DB pulls > 0 days and recomputes;
      the exotic activities-exist-baselines-missing state falls back to
      the nightly job); log_manual_workout /
      delete_manual_workout's recompute-failure warnings do NOT point at
      sync_garmin_data as an immediate fix (it recomputes only when
      days_pulled > 0, tools.py:579-580) — they keep the literal
      "recompute failed" (tests/test_tools.py:731 pin; :754's
      recompute_failed flag untouched) and reword only the remedy tail:
      baselines may lag until the next successful sync (nightly job, or
      sync_garmin_data once new Garmin data exists); run_sql gains the
      fitness://schema pointer
  - name: "2026-07-10 doc fixes A/B/C"
    type: "inherited"
    signature: "generate_chart inline image + ALL_TOOLS promotion; get_today_status -> assemble_status; _augment_plan_workout"
    description: "Ship verbatim per docs/plans/2026-07-10-mcp-tool-ux-efficiency-design.md."

