name: CodeQL

# Static security analysis over the Python backend, plus GitHub Actions
# workflow scanning (supply-chain / injection issues in .github/workflows/*.yml).
# Free for public repos; surfaces injection / auth / path issues on the same
# code paths the security contract in CLAUDE.md protects.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "27 4 * * 1"  # weekly, Monday — catches new advisories on idle code

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            queries: security-and-quality
          # Scans .github/workflows/*.yml for supply-chain / injection issues
          # (untrusted-input-in-run-step, etc). Not a JS/TS stand-in — CodeQL
          # 2.23.5+ correctly errors if `javascript`/`javascript-typescript`
          # is used to scan workflow YAML with no real JS/TS source behind
          # it (this repo has none since the web UI's retirement); `actions`
          # is the real, dedicated language for this.
          - language: actions
            queries: ""
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.7
        with:
          languages: ${{ matrix.language }}
          queries: ${{ matrix.queries }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.7

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
