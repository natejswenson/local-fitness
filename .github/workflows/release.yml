name: Release

# Once CI is green on main (after a dev->main promotion), cut a GitHub Release
# for the version in pyproject.toml — but only if that version hasn't been
# released yet. So a normal promotion is a no-op; bumping `version` in pyproject
# (with a matching CHANGELOG entry) is what ships a release. Idempotent and
# version-driven. `workflow_run` always evaluates the DEFAULT branch's copy of
# this file, so this `[main]` trigger must live on main to fire.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  release:
    # Only when the CI run it followed actually succeeded.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version from pyproject.toml
        id: ver
        run: |
          version=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected version: $version"

      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          # Pull this version's section out of the changelog for release notes.
          notes=$(awk -v v="${{ steps.ver.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            /^## \[/ {f=0}
            f {print}
          ' CHANGELOG.md)
          [ -z "$notes" ] && notes="Release $tag"
          # Retry loop: a transient GitHub API failure (v0.23.0 was lost to an
          # HTTP 503 on `gh release create`, 2026-07-20) must not silently eat
          # the release — the job used to die on the first failed call. The
          # already-released check lives INSIDE the loop so a create that
          # succeeded server-side but failed to respond is caught as "already
          # released" on the next pass instead of double-creating.
          for attempt in 1 2 3 4 5; do
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already released — nothing to do."
              exit 0
            fi
            if gh release create "$tag" --target "${{ github.event.workflow_run.head_sha }}" \
                --title "$tag" --notes "$notes"; then
              echo "Released $tag."
              exit 0
            fi
            echo "gh release create failed (attempt $attempt/5) — retrying in 30s"
            sleep 30
          done
          echo "::error::failed to create $tag after 5 attempts"
          exit 1
