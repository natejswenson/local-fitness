name: Capture perf-benchmark baseline

# One-off, manually-triggered job: (re)captures the pytest-benchmark baseline
# committed at .benchmarks/Linux-CPython-3.12-64bit/0001_*.json, which
# ci.yml's "Perf-benchmark regression gate" step compares every PR against.
#
# Machine-id matched: pytest-benchmark's FileStorage nests every save under
# platform.system()-platform.python_implementation()-pyver-arch
# (Linux-CPython-3.12-64bit on ubuntu-latest). Capturing this anywhere else
# (e.g. locally on macOS) produces a save under Darwin-CPython-3.12-64bit/
# that ubuntu-latest's --benchmark-compare=0001 can never find, turning every
# subsequent `validate` run into a hard CI failure. Run this workflow, don't
# capture locally. See docs/plans/2026-07-09-mcp-speed-and-ui-retirement-design.md
# "Eval-proof methodology" for the full rationale.
#
# Re-run only to intentionally rebaseline (e.g. after a further perf
# improvement that should reset the comparison floor) — not routinely.
#
# Bootstrapping note: `workflow_dispatch` workflows are only dispatchable via
# the API/`gh workflow run` once the workflow FILE exists on the repo's
# DEFAULT branch (`main` here — see CLAUDE.md's Branching & release
# strategy). Since `main` only receives deliberate `dev -> main` promotions,
# this workflow can't be dispatched from a feature branch pre-merge. The
# 0001 baseline committed alongside this file's initial landing was instead
# captured via a local `docker run --platform=linux/amd64 python:3.12-slim`
# container: pytest-benchmark's machine-id
# (`platform.system()-implementation-pyver-arch`) depends only on OS/arch
# bitness, not on being a real GitHub-hosted runner, so a matching Linux
# container produces an identical, valid `Linux-CPython-3.12-64bit` save.
# Once this workflow has landed on `main` at least once, prefer dispatching
# it for real over the Docker workaround.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev group)
        run: uv sync --dev

      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core

      - name: Capture benchmark baseline
        run: |
          uv run pytest tests/test_perf_benchmarks.py --benchmark-only \
            --benchmark-storage=file://./.benchmarks --benchmark-autosave --no-cov

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-baseline
          path: .benchmarks/
          retention-days: 14
          include-hidden-files: true
