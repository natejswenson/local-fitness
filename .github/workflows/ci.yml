name: CI

# Treat the agent as code: lint it, test the deterministic core behind a
# coverage gate, score the prompt, AND compile the Docker image — so the
# documented container deploy can't silently break (a base-image bump that
# passes the host build but breaks `docker compose up --build`).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev group)
        run: uv sync --dev

      # WeasyPrint (generate_brief_report's PDF renderer) needs Pango/HarfBuzz
      # natively — pulled in here so pytest can import it. Ubuntu's apt puts
      # these on the normal dynamic-linker search path, so (unlike macOS) no
      # DYLD_LIBRARY_PATH-equivalent env var is needed after this step.
      - name: Install WeasyPrint native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core

      # The brand token block in src/local_fitness/agent/branding.py is a GENERATED region owned by the
      # `press` skill (github.com/natejswenson/claude-skills). Fails if it was
      # hand-edited, or if the shared tokens moved without re-emitting here, so
      # this repo can never silently drift from the brand every other product
      # renders from. Pinned, not @latest: a token change upstream should surface
      # as a failing check to be adopted deliberately, never land unreviewed.
      #   npx -y @natjswenson/press@0.7.1 emit --repo .
      - name: Brand tokens in sync (press)
        run: npx -y @natjswenson/press@0.7.1 check --repo .

      - name: Lint
        run: uv run ruff check .

      - name: Run tests with coverage gate
        run: uv run pytest --cov-report=xml

      # Separate axis from the coverage gate above: latency + db.connect()
      # open-count regression, gated against the committed baseline captured
      # by capture-perf-baseline.yml on this same runner type (machine-id
      # matched — see docs/plans/2026-07-09-mcp-speed-and-ui-retirement-design.md
      # "Eval-proof methodology"). --no-cov is load-bearing: the global
      # --cov-fail-under=85 addopts would otherwise fail this narrow slice
      # on coverage alone, independent of whether the benchmarks pass.
      - name: Perf-benchmark regression gate
        run: |
          uv run pytest tests/test_perf_benchmarks.py --benchmark-only \
            --benchmark-storage=file://./.benchmarks --benchmark-autosave \
            --benchmark-compare=0001 --benchmark-compare-fail=min:15% --no-cov

      # Always runs (even when the gate above fails) so a genuine ubuntu-latest
      # capture is downloadable without needing a dispatched capture-perf-
      # baseline.yml run — see that workflow's bootstrapping note.
      - name: Upload this run's benchmark save
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-benchmark-run-${{ github.run_id }}
          path: .benchmarks/
          retention-days: 14
          include-hidden-files: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false  # badge/upload is informational; the gate lives in pytest

      - name: Score the agent prompt
        run: uv run python scripts/score_prompt.py

  docker-build:
    # Compile the image — the path CI otherwise never exercises. No push; GHA
    # layer cache keeps it fast. Catches base-image drift the host build
    # wouldn't (e.g. a `docker compose up --build` regression).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
